root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -tags dev -o ./tmp/main ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "spec", "winres", "node_modules"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "html", "css", "js", "svg"]
  kill_delay = "0s"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = false
